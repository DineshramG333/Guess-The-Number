<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <style>
        /* --- Global Reset & Cyberpunk/Neon Background --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2c3e50 0%, #0f171e 100%);
            overflow: hidden;
        }

        /* --- 3D Floating Game Container --- */
        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            
            /* Powerful 3D Shadow & Layering Effect */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 2px 2px rgba(255, 255, 255, 0.2);
            transform: perspective(1000px) rotateX(5deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .game-container:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(0, 168, 255, 0.2);
        }

        /* --- Eye-Catching Typography --- */
        h1 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 168, 255, 0.6), 0 5px 0px #111;
        }

        /* --- 3D Input Field --- */
        #guess {
            width: 100%;
            padding: 12px 20px;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            background: #1a242f;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 1.5rem;
            
            /* Inner shadow for "sunken" 3D feel */
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        #guess:focus {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 168, 255, 0.5);
            background: #223142;
        }

        /* --- Tactile 3D Push Button --- */
        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00a8ff, #0097e6);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            
            /* Realistic button depth */
            box-shadow: 0 6px 0 #006b9e, 0 12px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
            transition: all 0.1s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #14b3ff, #00a8ff);
        }

        button:active {
            /* Button physically pushes down when clicked */
            transform: translateY(4px);
            box-shadow: 0 2px 0 #006b9e, 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* --- Result & Status Text --- */
        #result {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 2rem;
            min-height: 28px; /* Prevents layout shifting */
            color: #f5f6fa;
            transition: all 0.3s ease;
        }

        /* Dynamic classes injected by JS for feedback color */
        .status-right {
            color: #4cd137 !important;
            text-shadow: 0 0 10px rgba(76, 209, 55, 0.4);
            animation: celebrate 0.5s ease alternate infinite;
        }

        .status-wrong {
            color: #e84118 !important;
            text-shadow: 0 0 10px rgba(232, 65, 24, 0.4);
            animation: shake 0.3s ease;
        }

        /* --- Score Dashboard --- */
        #score {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: #95afc0;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
        }

        /* --- Keyframe Animations --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes celebrate {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Guess the Number</h1>
        <input type="number" id="guess" placeholder="1 to 10" min="1" max="10">
        <button onclick="check()">Check</button>
        <p id="result">Take a guess to start!</p>
        <p id="score">Score: 10</p>
    </div>

    <script>
        var guess = document.getElementById("guess");
        var result = document.getElementById("result");
        var score = document.getElementById("score");
        
        var rand = Math.floor(Math.random() * 10) + 1;
        var TOTAL_SCORE = 10;
        var gameOver = false;

        function check() {
            if (gameOver) return; // Stop execution if game ended

            var enter = parseInt(guess.value);

            // Simple validation check
            if (isNaN(enter) || enter < 1 || enter > 10) {
                result.textContent = "Please enter a number between 1 and 10!";
                result.className = "status-wrong";
                return;
            }

            if (enter === rand) {
                result.textContent = "🎉 Correct! You Win!";
                result.className = "status-right";
                gameOver = true;
                
                // Slight delay on alert so the CSS visual change renders first
                setTimeout(function() {
                    alert("Congratulations! You guessed the number.");
                }, 100);
            } else {
                TOTAL_SCORE -= 1;
                score.textContent = "Score: " + TOTAL_SCORE;
                
                // Force animation re-trigger for consecutive wrong answers
                result.className = ""; 
                void result.offsetWidth; 
                
                if (TOTAL_SCORE <= 0) {
                    result.textContent = "💥 Game Over! The number was " + rand;
                    result.className = "status-wrong";
                    gameOver = true;
                } else {
                    result.textContent = enter > rand ? "Too High! Try Again." : "Too Low! Try Again.";
                    result.className = "status-wrong";
                }
            }
            
            // Clear input automatically for the next guess
            guess.value = "";
            guess.focus();
        }
    </script>
</body>
</html>
